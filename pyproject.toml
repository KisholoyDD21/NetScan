[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "netscan"
version = "0.1.0"
description = "Authorized Nmap orchestration with typed results and multi-format reports"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "NetScan contributors"}]
keywords = ["nmap", "network-scanning", "security", "reporting", "blue-team"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Topic :: Security"]
dependencies = [
  "typer>=0.12,<1.0", "rich>=13.7", "python-nmap>=0.7.1", "pydantic>=2.7",
  "pydantic-settings>=2.2", "PyYAML>=6.0", "Jinja2>=3.1"
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5", "black>=24.4", "mypy>=1.10", "types-PyYAML>=6.0.12", "pre-commit>=3.7"]

[project.scripts]
netscan = "netscan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/netscan"]

[tool.hatch.build.targets.wheel.force-include]
"src/netscan/profile_data" = "netscan/profile_data"

[tool.pytest.ini_options]
addopts = "-q --cov=netscan --cov-report=term-missing --cov-fail-under=65"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["netscan"]
warn_unused_ignores = true
